name: Generate PPF lockfile once
on:
  push:
    branches: [audit-fixes-20260920]
    paths:
      - ".github/workflows/generate-ppf-lock.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit-fixes-20260920
      - uses: actions/setup-node@v6
        with:
          node-version-file: "templates/quarto-book/.nvmrc"
      - name: Generate deterministic npm lockfile
        working-directory: templates/quarto-book
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/quarto-book/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate pinned PPF npm lockfile"
          git push origin HEAD:audit-fixes-20260920
