name: Reference Template CI

on:
  pull_request:
    paths:
      - "templates/quarto-book/**"
      - "schema/**"
      - "SPECIFICATION*.md"
      - "docs/PROVIDER_INTEGRATION_SEMANTIC_MIGRATION*.md"
      - "docs/PUBLICATION_VISIBILITY_ACCESS_MIGRATION*.md"
      - "docs/CLOUDFLARE_ACCESS_PROFILE*.md"
      - "docs/CLOUDFLARE_OBSERVED_UI_MAPPING*.md"
      - "docs/CLOUDFLARE_GITHUB_AUTHORIZATION*.md"
      - "docs/CLOUDFLARE_SECURITY_PROFILES*.md"
      - "docs/FIRST_PILOT_LESSONS*.md"
      - "docs/REFERENCE_IMPLEMENTATION_AUDIT*.md"
      - "docs/TEMPLATE_ADOPTION_AND_UPGRADE*.md"
      - ".github/workflows/reference-template-ci.yml"
  push:
    branches: [main]
    paths:
      - "templates/quarto-book/**"
      - "schema/**"
      - "SPECIFICATION*.md"
      - "docs/PROVIDER_INTEGRATION_SEMANTIC_MIGRATION*.md"
      - "docs/PUBLICATION_VISIBILITY_ACCESS_MIGRATION*.md"
      - "docs/CLOUDFLARE_ACCESS_PROFILE*.md"
      - "docs/CLOUDFLARE_OBSERVED_UI_MAPPING*.md"
      - "docs/CLOUDFLARE_GITHUB_AUTHORIZATION*.md"
      - "docs/CLOUDFLARE_SECURITY_PROFILES*.md"
      - "docs/FIRST_PILOT_LESSONS*.md"
      - "docs/REFERENCE_IMPLEMENTATION_AUDIT*.md"
      - "docs/TEMPLATE_ADOPTION_AND_UPGRADE*.md"
      - ".github/workflows/reference-template-ci.yml"

permissions:
  contents: read

jobs:
  validate-quarto-workers-builds-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: templates/quarto-book
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: "templates/quarto-book/.nvmrc"
          cache: npm
          cache-dependency-path: "templates/quarto-book/package-lock.json"
      - name: Install locked Wrangler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Wrangler version
        run: test "$(npx wrangler --version | tail -n 1)" = "4.135.0"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install schema validation dependencies
        run: python -m pip install "PyYAML==6.0.3" "jsonschema==4.25.1"
      - name: Validate installable template upgrade contract
        run: python scripts/check_template_manifest.py
      - name: Validate reference publishing.yaml against PPF schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from jsonschema import Draft202012Validator
          data = yaml.safe_load(Path("publishing.yaml").read_text(encoding="utf-8"))
          schema = json.loads(Path("../../schema/publishing.schema.json").read_text(encoding="utf-8"))
          errors = sorted(Draft202012Validator(schema).iter_errors(data), key=lambda e: list(e.path))
          if errors:
              for error in errors:
                  where = ".".join(str(p) for p in error.path) or "<root>"
                  print(f"{where}: {error.message}")
              raise SystemExit(1)
          print("Reference publishing.yaml validates against PPF schema.")
          PY
      - name: Validate publication visibility/access schema semantics
        run: |
          python - <<'PY'
          import copy, json
          from pathlib import Path
          import yaml
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("../../schema/publishing.schema.json").read_text(encoding="utf-8"))
          validator = Draft202012Validator(schema)
          base = yaml.safe_load(Path("publishing.yaml").read_text(encoding="utf-8"))
          restricted = copy.deepcopy(base)
          restricted["source"]["visibility"] = "private"
          restricted["publication"]["web"]["authorization_state"] = "authorized"
          restricted["publication"]["web"]["visibility"] = "restricted"
          restricted["publication"]["web"]["access"] = {"mode":"authenticated","implementation":"example-access-layer","policy_ref":"docs/access-policy.md"}
          restricted["deployment"]["web"]["provider_url"] = "https://provider.example.invalid"
          restricted["deployment"]["web"]["canonical_identity"] = {"type":"provider-native","url":"https://provider.example.invalid"}
          errors = list(validator.iter_errors(restricted))
          if errors:
              for error in errors: print(error.message)
              raise SystemExit("restricted-publication example should validate")
          invalid = copy.deepcopy(restricted); invalid["publication"]["web"]["visibility"] = "world-readable"
          if not list(validator.iter_errors(invalid)): raise SystemExit("invalid publication visibility unexpectedly validated")
          invalid = copy.deepcopy(restricted); invalid["publication"]["web"]["access"]["mode"] = "password"
          if not list(validator.iter_errors(invalid)): raise SystemExit("provider-specific access mode unexpectedly validated")
          print("Publication visibility/access/canonical-identity schema semantics passed.")
          PY
      - name: Reject deployment without publication authorization
        run: |
          python - <<'PY'
          import copy, json
          from pathlib import Path
          import yaml
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("../../schema/publishing.schema.json").read_text(encoding="utf-8"))
          base = yaml.safe_load(Path("publishing.yaml").read_text(encoding="utf-8"))
          invalid = copy.deepcopy(base)
          invalid["deployment"]["web"]["enabled"] = True
          invalid["publication"]["web"]["authorization_state"] = "not-authorized"
          if not list(Draft202012Validator(schema).iter_errors(invalid)):
              raise SystemExit("deployment enabled without authorization unexpectedly validated")
          valid = copy.deepcopy(base)
          valid["deployment"]["web"]["enabled"] = True
          valid["publication"]["web"]["authorization_state"] = "authorized"
          if list(Draft202012Validator(schema).iter_errors(valid)):
              raise SystemExit("authorized deployment should validate")
          print("Publication authorization/deployment invariant passed.")
          PY
      - name: Validate installable publication authorization boundary
        run: |
          grep -q "visibility: public" publishing.yaml
          grep -q "authorization_state: not-authorized" publishing.yaml
          grep -q "mode: none" publishing.yaml
          grep -q "provider_url: null" publishing.yaml
          grep -q "canonical_identity:" publishing.yaml
          grep -q "REFERENCE-ONLY / DATED PROVIDER MAPPING" ../../docs/CLOUDFLARE_ACCESS_PROFILE.md
          grep -q "Worker-level" ../../docs/CLOUDFLARE_ACCESS_PROFILE.md
          grep -q "private repository => enable Access" ../../docs/CLOUDFLARE_OBSERVED_UI_MAPPING.md
          grep -q "deployment-credential security from publication access" ../../docs/CLOUDFLARE_SECURITY_PROFILES.md
      - name: Validate reference publication contract
        run: make check
      - name: Validate normative visibility/access migration markers
        run: |
          grep -q "Publication visibility and access policy" ../../SPECIFICATION.md
          grep -q "Canonical publication identity and delivery provider" ../../SPECIFICATION.md
          grep -q "private source => private publication" ../../docs/PUBLICATION_VISIBILITY_ACCESS_MIGRATION.md
          grep -q "GitHub Free / paid Pages product limitations" ../../docs/PUBLICATION_VISIBILITY_ACCESS_MIGRATION.md
      - name: Validate pilot evidence reconciliation markers
        run: |
          grep -q "Current reconciled pilot state" ../../docs/FIRST_PILOT_LESSONS.md
          grep -q "not production-tested" ../../docs/FIRST_PILOT_LESSONS.md
          grep -q "Current Cloudflare staging/runtime evidence" ../../docs/REFERENCE_IMPLEMENTATION_AUDIT.md
          grep -q "Cloudflare workers.dev = current canonical production" ../../docs/REFERENCE_IMPLEMENTATION_AUDIT.md
      - name: Compile runtime verification helper
        run: python -m py_compile scripts/verify_public_site.py
      - name: Simulate Workers Builds Web build
        run: make cloudflare-build
