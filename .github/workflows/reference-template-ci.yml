name: Reference Template CI

on:
  pull_request:
    paths:
      - "templates/quarto-book/**"
      - "providers/cloudflare/**"
      - "providers/infrastructure/**"
      - "docs/GITHUB_CLOUDFLARE_INTEGRATION*.md"
      - "schema/**"
      - "SPECIFICATION*.md"
      - "docs/PROVIDER_INTEGRATION_SEMANTIC_MIGRATION*.md"
      - "docs/PUBLICATION_VISIBILITY_ACCESS_MIGRATION*.md"
      - "docs/CLOUDFLARE_ACCESS_PROFILE*.md"
      - "docs/CLOUDFLARE_OBSERVED_UI_MAPPING*.md"
      - "docs/CLOUDFLARE_GITHUB_AUTHORIZATION*.md"
      - "docs/CLOUDFLARE_SECURITY_PROFILES*.md"
      - "docs/CI_COST_POLICY*.md"
      - "docs/AGENT_PROVISIONED_EXTERNAL_CI*.md"
      - "docs/TRUSTED_SECRET_BROKER*.md"
      - "docs/FIRST_PILOT_LESSONS*.md"
      - "docs/REFERENCE_IMPLEMENTATION_AUDIT*.md"
      - "docs/TEMPLATE_ADOPTION_AND_UPGRADE*.md"
      - ".github/workflows/reference-template-ci.yml"
  push:
    branches: [main]
    paths:
      - "templates/quarto-book/**"
      - "providers/cloudflare/**"
      - "providers/infrastructure/**"
      - "docs/GITHUB_CLOUDFLARE_INTEGRATION*.md"
      - "schema/**"
      - "SPECIFICATION*.md"
      - "docs/PROVIDER_INTEGRATION_SEMANTIC_MIGRATION*.md"
      - "docs/PUBLICATION_VISIBILITY_ACCESS_MIGRATION*.md"
      - "docs/CLOUDFLARE_ACCESS_PROFILE*.md"
      - "docs/CLOUDFLARE_OBSERVED_UI_MAPPING*.md"
      - "docs/CLOUDFLARE_GITHUB_AUTHORIZATION*.md"
      - "docs/CLOUDFLARE_SECURITY_PROFILES*.md"
      - "docs/CI_COST_POLICY*.md"
      - "docs/AGENT_PROVISIONED_EXTERNAL_CI*.md"
      - "docs/TRUSTED_SECRET_BROKER*.md"
      - "docs/FIRST_PILOT_LESSONS*.md"
      - "docs/REFERENCE_IMPLEMENTATION_AUDIT*.md"
      - "docs/TEMPLATE_ADOPTION_AND_UPGRADE*.md"
      - ".github/workflows/reference-template-ci.yml"

permissions:
  contents: read

jobs:
  validate-quarto-workers-builds-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: templates/quarto-book
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "templates/quarto-book/.nvmrc"
          cache: npm
          cache-dependency-path: "templates/quarto-book/package-lock.json"
      - name: Install locked Wrangler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Wrangler version
        run: test "$(npx wrangler --version | tail -n 1)" = "4.135.0"
      - name: Verify pinned Wrangler supports Worker Previews
        run: npx wrangler preview --help >/dev/null
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install schema validation dependencies
        run: python -m pip install "PyYAML==6.0.3" "jsonschema==4.25.1"
      - name: Validate installable template upgrade contract
        run: python scripts/check_template_manifest.py
      - name: Validate infrastructure desired-state manifest
        run: python ../../providers/infrastructure/manifest.py project.infrastructure.json
      - name: Test infrastructure manifest safety and visibility matrix
        run: cd ../.. && python -m unittest discover -s providers/infrastructure/tests -v
      - name: Validate project-provisioning and CI-cost contracts
        run: |
          python -m py_compile ../../providers/infrastructure/provisioning.py
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from jsonschema import Draft202012Validator

          broker_schema = json.loads(Path("../../schema/secret-broker-request.schema.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(broker_schema)

          ci_schema = json.loads(Path("../../schema/ci-cost-policy.schema.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(ci_schema)
          ci_policy = yaml.safe_load(Path("ci-cost-policy.yaml").read_text(encoding="utf-8"))
          ci_errors = list(Draft202012Validator(ci_schema).iter_errors(ci_policy))
          if ci_errors:
              raise SystemExit("ci-cost-policy.yaml does not validate: " + ci_errors[0].message)
          if ci_policy.get("profile") != "private-project-quota-saver":
              raise SystemExit("reference template must use private-project-quota-saver")
          light_pr = ci_policy.get("github_actions", {}).get("automatic", {}).get("configuration_pull_request", {})
          if light_pr.get("branches") != ["main"]:
              raise SystemExit("ci-cost-policy must restrict automatic configuration PR checks to main")
          if ci_policy.get("github_actions", {}).get("artifacts", {}).get("manual_publication_retention_days") != "1":
              raise SystemExit("ci-cost-policy manual publication retention must be 1 day")

          infra = json.loads(Path("project.infrastructure.json").read_text(encoding="utf-8"))
          if infra["deployment"]["provider"] != "cloudflare-workers-builds":
              raise SystemExit("reference template must use Workers Builds native by default")
          if infra["deployment"]["securityProfile"] != "workers-builds-native":
              raise SystemExit("reference template has wrong default security profile")
          if infra["deployment"]["credentialStrategy"] != "provider-managed-user-token":
              raise SystemExit("reference template has wrong default credential strategy")
          if infra["deployment"]["secretBroker"] is not False:
              raise SystemExit("native default must not require the Secret Broker")
          if infra["deployment"]["ciCostProfile"] != "private-project-quota-saver":
              raise SystemExit("reference template has wrong CI cost profile")
          if infra["cloudflare"]["accessMode"] != "worker-scoped-access":
              raise SystemExit("reference template must default to per-project Worker Access")

          contract = yaml.safe_load(Path("cloudflare-builds.yaml").read_text(encoding="utf-8"))
          if contract.get("mode") != "workers-builds-git":
              raise SystemExit("Cloudflare integration contract must default to Workers Builds Git")
          if contract.get("git", {}).get("non_production_branch_builds") is not False:
              raise SystemExit("default native profile must keep non-production builds disabled")
          ci_cost = contract.get("ci_cost", {})
          if ci_cost.get("profile") != "private-project-quota-saver":
              raise SystemExit("Cloudflare integration contract is missing quota-saver CI ownership")
          if ci_cost.get("github_actions", {}).get("automatic_main_push") is not False:
              raise SystemExit("quota-saver template must not auto-run GitHub Actions on main pushes")
          if ci_cost.get("duplicate_web_build_across_github_and_cloudflare") is not False:
              raise SystemExit("quota-saver template must not duplicate Web builds across providers")

          external = contract.get("external_ci", {})
          if external.get("status") != "optional-advanced":
              raise SystemExit("external CI must remain an optional advanced profile")
          if external.get("workflow") != ".github/workflows/deploy-cloudflare.yml":
              raise SystemExit("optional external CI workflow path drifted")

          def workflow(path):
              try:
                  value = yaml.load(Path(path).read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
              except yaml.YAMLError as exc:
                  raise SystemExit(path + " is not valid YAML: " + str(exc))
              if not isinstance(value, dict) or not isinstance(value.get("jobs"), dict):
                  raise SystemExit(path + " does not contain a jobs mapping")
              return value

          light = workflow(".github/workflows/project-check.yml")
          light_on = light.get("on", {})
          if set(light_on) != {"pull_request", "workflow_dispatch"}:
              raise SystemExit("project-check.yml must run only on pull_request and workflow_dispatch")
          if light_on.get("pull_request", {}).get("branches") != ["main"]:
              raise SystemExit("project-check.yml pull_request trigger must target main only")
          light_job = light.get("jobs", {}).get("validate-contracts", {})
          if int(light_job.get("timeout-minutes", "999")) > 5:
              raise SystemExit("project-check.yml timeout must be <= 5 minutes")
          concurrency = light.get("concurrency", {})
          if concurrency.get("cancel-in-progress") != "true":
              raise SystemExit("project-check.yml must cancel superseded runs")
          pull_paths = set(light_on.get("pull_request", {}).get("paths", []))
          for required_path in ("publishing.yaml", "cloudflare-builds.yaml", "ci-cost-policy.yaml", ".github/workflows/**"):
              if required_path not in pull_paths:
                  raise SystemExit("project-check.yml is missing configuration path " + required_path)

          for heavy_path in (
              ".github/workflows/web.yml",
              ".github/workflows/cloudflare-contract-ci.yml",
              ".github/workflows/deploy-cloudflare.yml",
              ".github/workflows/build-publication.yml",
          ):
              heavy = workflow(heavy_path)
              if set(heavy.get("on", {})) != {"workflow_dispatch"}:
                  raise SystemExit(heavy_path + " must be workflow_dispatch-only in the quota-saver template")

          deploy_text = Path(".github/workflows/deploy-cloudflare.yml").read_text(encoding="utf-8")
          for required in (
              "github-actions-external-ci",
              "CLOUDFLARE_API_TOKEN",
              "CLOUDFLARE_ACCOUNT_ID",
              "authorization_state",
              "visibility",
              "authenticated",
              "wrangler deploy",
          ):
              if required not in deploy_text:
                  raise SystemExit("advanced deployment workflow missing " + required)

          publication = workflow(".github/workflows/build-publication.yml")
          upload_steps = [
              item for item in publication.get("jobs", {}).get("build", {}).get("steps", [])
              if isinstance(item, dict) and str(item.get("uses", "")).startswith("actions/upload-artifact@")
          ]
          if not upload_steps:
              raise SystemExit("manual publication workflow is missing artifact upload")
          retention = int(upload_steps[0].get("with", {}).get("retention-days", "999"))
          if retention > 1:
              raise SystemExit("manual publication artifact retention must be <= 1 day")

          print("Project-provisioning and CI-cost contracts are internally consistent.")
          PY
      - name: Validate private integration state schema
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          with open("../../schema/integration-state.schema.json", encoding="utf-8") as handle:
              schema = json.load(handle)
          Draft202012Validator.check_schema(schema)
          print("Private integration state schema is valid.")
          PY
      - name: Validate reference publishing.yaml against PPF schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from jsonschema import Draft202012Validator
          data = yaml.safe_load(Path("publishing.yaml").read_text(encoding="utf-8"))
          schema = json.loads(Path("../../schema/publishing.schema.json").read_text(encoding="utf-8"))
          errors = sorted(Draft202012Validator(schema).iter_errors(data), key=lambda e: list(e.path))
          if errors:
              for error in errors:
                  where = ".".join(str(p) for p in error.path) or "<root>"
                  print(f"{where}: {error.message}")
              raise SystemExit(1)
          print("Reference publishing.yaml validates against PPF schema.")
          PY
      - name: Validate publication visibility/access schema semantics
        run: |
          python - <<'PY'
          import copy, json
          from pathlib import Path
          import yaml
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("../../schema/publishing.schema.json").read_text(encoding="utf-8"))
          validator = Draft202012Validator(schema)
          base = yaml.safe_load(Path("publishing.yaml").read_text(encoding="utf-8"))
          restricted = copy.deepcopy(base)
          restricted["source"]["visibility"] = "private"
          restricted["publication"]["web"]["authorization_state"] = "authorized"
          restricted["publication"]["web"]["visibility"] = "restricted"
          restricted["publication"]["web"]["access"] = {"mode":"authenticated","implementation":"example-access-layer","policy_ref":"docs/access-policy.md"}
          restricted["deployment"]["web"]["provider_url"] = "https://provider.example.invalid"
          restricted["deployment"]["web"]["canonical_identity"] = {"type":"provider-native","url":"https://provider.example.invalid"}
          errors = list(validator.iter_errors(restricted))
          if errors:
              for error in errors: print(error.message)
              raise SystemExit("restricted-publication example should validate")
          invalid = copy.deepcopy(restricted); invalid["publication"]["web"]["visibility"] = "world-readable"
          if not list(validator.iter_errors(invalid)): raise SystemExit("invalid publication visibility unexpectedly validated")
          invalid = copy.deepcopy(restricted); invalid["publication"]["web"]["access"]["mode"] = "password"
          if not list(validator.iter_errors(invalid)): raise SystemExit("provider-specific access mode unexpectedly validated")
          print("Publication visibility/access/canonical-identity schema semantics passed.")
          PY
      - name: Reject deployment without publication authorization
        run: |
          python - <<'PY'
          import copy, json
          from pathlib import Path
          import yaml
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("../../schema/publishing.schema.json").read_text(encoding="utf-8"))
          base = yaml.safe_load(Path("publishing.yaml").read_text(encoding="utf-8"))
          invalid = copy.deepcopy(base)
          invalid["deployment"]["web"]["enabled"] = True
          invalid["publication"]["web"]["authorization_state"] = "not-authorized"
          if not list(Draft202012Validator(schema).iter_errors(invalid)):
              raise SystemExit("deployment enabled without authorization unexpectedly validated")
          valid = copy.deepcopy(base)
          valid["deployment"]["web"]["enabled"] = True
          valid["publication"]["web"]["authorization_state"] = "authorized"
          if list(Draft202012Validator(schema).iter_errors(valid)):
              raise SystemExit("authorized deployment should validate")
          print("Publication authorization/deployment invariant passed.")
          PY
      - name: Validate installable publication safety boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          data = yaml.safe_load(Path("publishing.yaml").read_text(encoding="utf-8"))
          source = data["source"]
          web = data["publication"]["web"]
          access = web["access"]
          deployment = data["deployment"]["web"]

          expected = [
              (source.get("visibility") == "private", "source.visibility must default to private"),
              (web.get("authorization_state") == "not-authorized", "Web publication must start not-authorized"),
              (web.get("visibility") == "restricted", "Web visibility must default to restricted"),
              (access.get("mode") == "authenticated", "restricted Web must default to authenticated access"),
              (access.get("implementation") == "cloudflare-access", "reference access implementation must be cloudflare-access"),
              (access.get("policy_ref") == "shared-reader-access", "template must record only the shared access-policy reference"),
              (deployment.get("enabled") is False, "deployment must start disabled"),
              (deployment.get("status") == "staged", "deployment must start staged"),
              (deployment.get("provider_url") is None, "provider URL must be unset before deployment"),
              ("canonical_identity" in deployment, "canonical identity object must exist"),
          ]
          failed = [message for ok, message in expected if not ok]
          if failed:
              raise SystemExit("\n".join(failed))
          print("Installable private-source / restricted-Web safety boundary passed.")
          PY
          grep -q "REFERENCE-ONLY / DATED PROVIDER MAPPING" ../../docs/CLOUDFLARE_ACCESS_PROFILE.md
          grep -q "Worker-level" ../../docs/CLOUDFLARE_ACCESS_PROFILE.md
          grep -q "private repository => enable Access" ../../docs/CLOUDFLARE_OBSERVED_UI_MAPPING.md
          grep -q "Deployment credential security is separate from publication access" ../../docs/CLOUDFLARE_SECURITY_PROFILES.md
      - name: Validate reference publication contract
        run: make check
      - name: Validate normative visibility/access migration markers
        run: |
          grep -q "Publication visibility and access policy" ../../SPECIFICATION.md
          grep -q "Canonical publication identity and delivery provider" ../../SPECIFICATION.md
          grep -q "private source => private publication" ../../docs/PUBLICATION_VISIBILITY_ACCESS_MIGRATION.md
          grep -q "GitHub Free / paid Pages product limitations" ../../docs/PUBLICATION_VISIBILITY_ACCESS_MIGRATION.md
      - name: Validate pilot evidence reconciliation markers
        run: |
          grep -q "Current reconciled pilot evidence status" ../../docs/FIRST_PILOT_LESSONS.md
          grep -q "Current reconciled pilot state" ../../docs/FIRST_PILOT_LESSONS.md
          grep -q "not production-tested" ../../docs/FIRST_PILOT_LESSONS.md
          ! grep -q "canonical production remains GitHub Pages" ../../docs/FIRST_PILOT_LESSONS.md
          grep -q "Current Cloudflare staging/runtime evidence" ../../docs/REFERENCE_IMPLEMENTATION_AUDIT.md
          grep -q "Cloudflare workers.dev = current canonical production" ../../docs/REFERENCE_IMPLEMENTATION_AUDIT.md
      - name: Compile runtime verification helper
        run: python -m py_compile scripts/verify_public_site.py
      - name: Test Cloudflare lifecycle contract adapter
        run: python -m unittest discover -s ../../providers/cloudflare/tests -v
      - name: Simulate Workers Builds Web build
        run: make cloudflare-build
