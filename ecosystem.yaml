schema_version: "1.1"
current_component: ppf
human_entrypoint:
  role: human-conceptual-entry
  homepage: https://chongliuphil.github.io/AI-Assisted-Human-Inquiry-and-Creation-Protocol/
  guide_zh_cn: https://github.com/ChongLiuPhil/AI-Assisted-Human-Inquiry-and-Creation-Protocol/blob/main/docs/HUMAN_GUIDE.zh-CN.md
  guide_en: https://github.com/ChongLiuPhil/AI-Assisted-Human-Inquiry-and-Creation-Protocol/blob/main/docs/HUMAN_GUIDE.md
machine_entrypoint:
  role: composition-and-configuration-entry
  ecosystem: https://github.com/ChongLiuPhil/Inquiry-Publishing-Project-Starter/blob/main/ecosystem.yaml
  agent_retrieval_contract: https://github.com/ChongLiuPhil/Inquiry-Publishing-Project-Starter/blob/main/docs/AGENT_RETRIEVAL_CONTRACT.md
ecosystem_entrypoint: https://github.com/ChongLiuPhil/Inquiry-Publishing-Project-Starter/blob/main/docs/ECOSYSTEM.md
agent_retrieval_contract: https://github.com/ChongLiuPhil/Inquiry-Publishing-Project-Starter/blob/main/docs/AGENT_RETRIEVAL_CONTRACT.md
llms_entrypoint: https://chongliuphil.github.io/Personal-Publishing-Framework/llms.txt
homepage: https://chongliuphil.github.io/Personal-Publishing-Framework/
repository: https://github.com/ChongLiuPhil/Personal-Publishing-Framework
role: source-centered publishing lifecycle and continuous web
baseline:
  default_profile: full-research-publication
  ahicp: full-compatible-upstream
  ppf: full
  vault_interface: public-metadata-adapter
  continuous_web: required-for-published-projects
  source_visibility: private-by-default-for-original-work
  web_visibility: restricted-by-default-for-unpublished-work
  cloudflare_access: required-for-private-or-transitional-publications
  reduced_profiles: explicit-human-selection-only
components:
  ahicp:
    homepage: https://chongliuphil.github.io/AI-Assisted-Human-Inquiry-and-Creation-Protocol/
    repository: https://github.com/ChongLiuPhil/AI-Assisted-Human-Inquiry-and-Creation-Protocol
  ppf:
    homepage: https://chongliuphil.github.io/Personal-Publishing-Framework/
    repository: https://github.com/ChongLiuPhil/Personal-Publishing-Framework
  vault_interface:
    homepage: https://chongliuphil.github.io/Vault-interface/
    repository: https://github.com/ChongLiuPhil/Vault-interface
  starter:
    homepage: https://chongliuphil.github.io/Inquiry-Publishing-Project-Starter/
    repository: https://github.com/ChongLiuPhil/Inquiry-Publishing-Project-Starter
private_state_rule: fetch only after explicit human authorization
public_links_grant_private_access: false
cloudflare:
  shared_contract: https://github.com/ChongLiuPhil/Inquiry-Publishing-Project-Starter/blob/main/docs/CONTINUOUS_WEB_CLOUDFLARE.md
  github_authorization_runbook: docs/CLOUDFLARE_GITHUB_AUTHORIZATION.md
  security_profiles: docs/CLOUDFLARE_SECURITY_PROFILES.md
  access_profile: docs/CLOUDFLARE_ACCESS_PROFILE.md
