schema_version: 1
mode: workers-builds-git
worker_runtime: workers-static-assets
access_modes:
  public:
    audience: anonymous
    requires_explicit_public_authorization: true
  selected-audience:
    implementation: cloudflare-access
    defaults:
      identity_method: one-time-pin
      session_duration: 24h
    requires_approved_reader_list: true

platform_security:
  worker_access:
    default: worker-scoped
    private_by_default: true
    account_wide_access: optional
    previews_protected_by_default: true
    project_bootstrap_required: true

git:
  provider: github
  repository: OWNER/REPOSITORY
  production_branch: main
  non_production_branch_builds: false
  root_directory: "/"

commands:
  build: "bash scripts/cloudflare_build.sh"
  deploy: "npx wrangler deploy"
  preview_deploy: "npx wrangler preview"

toolchain:
  node: "24"
  wrangler: "4.135.0"
  quarto: "1.10.18"

ci_cost:
  profile: private-project-quota-saver
  policy_ref: ci-cost-policy.yaml
  github_actions:
    automatic_pull_request: light-config-only
    automatic_main_push: false
    automatic_content_change: false
    heavy_validation: workflow-dispatch-only
  cloudflare_workers_builds:
    production_branch_build: true
    non_production_branch_builds: false
    previews: false
  duplicate_web_build_across_github_and_cloudflare: false

worker:
  name: replace-with-worker-name
  config: wrangler.jsonc
  static_assets_directory: ./_book

connection:
  cloudflare_account: project-setup-required
  github_app: project-setup-required
  repository_connection: project-setup-required
  worker_target: create-by-import-or-connect-existing
  production_trigger: main
  preview_trigger: disabled-by-default
  build_token: provider-managed-user-token

validation:
  repository_contract_ci: not-run
  first_production_build: not-run
  restricted_anonymous_denial: not-run
  second_push_auto_deploy: not-run
  production_cutover: blocked

security:
  credentials_in_repository: prohibited
  production_profile: workers-builds-native
  project_setup:
    github_repository_visibility: private
    cloudflare_git_authorization: human-assisted-once-per-project
    worker_access: worker-scoped-or-account-wide
    public_release: explicit-human-gate
  profiles:
    workers_builds_native:
      status: preferred-guided-project-setup
      token_type: user-token
      least_privilege: false
      caveat: workers-builds-currently-supports-provider-managed-user-token
    hardened_external_ci:
      status: optional-advanced
      token_type: account-owned-api-token
      desired_scope: individual-worker
      desired_role: editor
      least_privilege: true
      requires_secret_broker: true
      acceptance: pending-live-provider-verification

external_ci:
  status: optional-advanced
  provider: github-actions
  workflow: .github/workflows/deploy-cloudflare.yml
  required_repository_secrets:
    - CLOUDFLARE_API_TOKEN
    - CLOUDFLARE_ACCOUNT_ID
  credential_contract:
    token_owner: account
    scope: individual-worker
    role: Editor
    creation: trusted-secret-broker
    plaintext_must_not_enter_model_context: true

lifecycle:
  operations: [doctor, plan, apply, verify, rollback]
  state_record: .ppf/cloudflare-deployment.json
  rollback_policy: latest-previously-verified-production-version
  no_automatic_paid_upgrade: true
  preserve_existing_provider_until_explicit_cutover: true

preview:
  enabled_by_default: false
  enable_only_after:
    - access-protection-verified
    - preview-anonymous-denial-verified
