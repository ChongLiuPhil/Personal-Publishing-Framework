schema_version: 1
mode: github-actions-external-ci
worker_runtime: workers-static-assets
access_modes:
  public:
    audience: anonymous
    requires_explicit_public_authorization: true
  selected-audience:
    implementation: cloudflare-access
    defaults:
      identity_method: one-time-pin
      session_duration: 24h
    requires_approved_reader_list: true

platform_security:
  worker_access:
    baseline: account-wide
    destination: all_workers
    private_by_default: true
    public_exception: worker-scoped-bypass
    previews_protected_by_default: true
    bootstrap_required_before_worker_creation: true

git:
  provider: github
  repository: OWNER/REPOSITORY
  production_branch: main
  non_production_branch_builds: false
  root_directory: "/"

commands:
  build: "bash scripts/cloudflare_build.sh"
  deploy: "wrangler deploy"
  preview_deploy: "wrangler versions upload"

toolchain:
  node: "24"
  wrangler: "4.135.0"
  quarto: "1.10.18"

worker:
  name: replace-with-worker-name
  config: wrangler.jsonc
  static_assets_directory: ./_book

connection:
  cloudflare_account: unverified
  github_app: not-required-for-external-ci
  repository_connection: not-required-for-external-ci
  worker_target: provisioner-created
  production_trigger: github-actions-main
  preview_trigger: disabled-until-protected
  build_token: project-scoped-account-token-via-secret-broker

validation:
  repository_contract_ci: not-run
  first_preview_build: not-applicable-until-enabled
  workers_dev_http: not-run
  production_cutover: blocked

security:
  credentials_in_repository: prohibited
  native_profile_github_app_repository_scope: selected-repositories-only
  production_profile: agent-provisioned-external-ci
  profiles:
    workers_builds_native:
      status: operational-native
      token_type: user-token
      least_privilege: false
      caveat: workers-builds-currently-supports-user-tokens-only
    hardened_external_ci:
      status: preferred-agent-provisioning
      token_type: account-owned-api-token
      desired_scope: individual-worker
      desired_role: editor
      least_privilege: true
    future_native_granular:
      status: currently-unavailable
      desired_token_type: account-owned-api-token
      desired_scope: individual-worker
      desired_role: editor
      blocker: workers-builds-account-owned-token-not-yet-supported

external_ci:
  provider: github-actions
  workflow: .github/workflows/deploy-cloudflare.yml
  deploy_on:
    branch: main
  required_repository_secrets:
    - CLOUDFLARE_API_TOKEN
    - CLOUDFLARE_ACCOUNT_ID
  credential_contract:
    token_owner: account
    scope: individual-worker
    role: Editor
    creation: platform-secret-broker
    plaintext_must_not_enter_model_context: true
  worker_creation:
    executor: platform-provisioner
    requires: workers-product-admin
  access_precondition:
    destination: all_workers
    must_be_verified_before_worker_creation: true

lifecycle:
  operations: [doctor, plan, apply, verify, rollback]
  state_record: .ppf/cloudflare-deployment.json
  rollback_policy: latest-previously-verified-production-version
  no_automatic_paid_upgrade: true
  preserve_existing_provider_until_explicit_cutover: true

preview:
  enabled_by_default: false
  enable_only_after:
    - account-wide-access-verified
    - preview-anonymous-denial-verified
