name: Deploy restricted Continuous Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check durable publication authorization
        id: gate
        shell: bash
        run: |
          if grep -Eq '^    authorization_state: authorized$' publishing.yaml \
            && grep -Eq '^    enabled: true$' publishing.yaml; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Continuous Web remains staged; no deployment is authorized."
          fi
      - name: Install locked deployment toolchain
        if: steps.gate.outputs.deploy == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build canonical Web output
        if: steps.gate.outputs.deploy == 'true'
        run: make cloudflare-build
      - name: Deploy existing project Worker
        if: steps.gate.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
