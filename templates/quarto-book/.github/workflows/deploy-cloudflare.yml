name: Deploy restricted Continuous Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install publication-contract parser
        run: python -m pip install "PyYAML==6.0.3"
      - name: Check durable publication authorization
        id: gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path("publishing.yaml").read_text(encoding="utf-8"))
          web = data.get("publication", {}).get("web", {})
          deployment = data.get("deployment", {}).get("web", {})
          allowed = web.get("authorization_state") == "authorized" and deployment.get("enabled") is True
          print("deploy=" + ("true" if allowed else "false"))
          PY
          if ! grep -q '^deploy=true
      - name: Install locked deployment toolchain
        if: steps.gate.outputs.deploy == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build canonical Web output
        if: steps.gate.outputs.deploy == 'true'
        run: make cloudflare-build
      - name: Deploy existing project Worker
        if: steps.gate.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
 "$GITHUB_OUTPUT"; then
            echo "Continuous Web remains staged; no deployment is authorized."
          fi
      - name: Install locked deployment toolchain
        if: steps.gate.outputs.deploy == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build canonical Web output
        if: steps.gate.outputs.deploy == 'true'
        run: make cloudflare-build
      - name: Deploy existing project Worker
        if: steps.gate.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
