name: Continuous Web Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
      - name: Run canonical Web publication gate
        run: make web-publish-check
