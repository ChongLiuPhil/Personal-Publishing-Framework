name: Build Publication Artifact

on:
  workflow_dispatch:
    inputs:
      format:
        description: Publication format to build
        required: true
        type: choice
        options: [epub, pdf, docx, latex]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: "1.10.18"
      - name: Install TinyTeX for PDF
        if: inputs.format == 'pdf'
        run: quarto install tinytex --no-prompt
      - name: Render requested profile
        run: quarto render --profile "${{ inputs.format }}"
      - name: Verify requested artifact
        shell: bash
        run: |
          set -euo pipefail
          format="${{ inputs.format }}"
          output="_publication/$format"
          case "$format" in
            epub) extension="epub" ;;
            pdf) extension="pdf" ;;
            docx) extension="docx" ;;
            latex) extension="tex" ;;
            *) echo "Unsupported format: $format" >&2; exit 1 ;;
          esac
          test -d "$output"
          test -n "$(find "$output" -type f -name "*.$extension" -print -quit)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "publication-${{ inputs.format }}-${{ github.sha }}"
          path: "_publication/${{ inputs.format }}/"
          if-no-files-found: error
          retention-days: 1
