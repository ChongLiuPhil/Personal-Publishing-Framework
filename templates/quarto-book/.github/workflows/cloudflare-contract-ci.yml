name: Cloudflare Build Contract CI

on:
  pull_request:
    paths:
      - "cloudflare-builds.yaml"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "publishing.yaml"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/cloudflare-contract-ci.yml"
  push:
    branches:
      - main
    paths:
      - "cloudflare-builds.yaml"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "publishing.yaml"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/cloudflare-contract-ci.yml"

permissions:
  contents: read

jobs:
  validate-cloudflare-build-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Install locked Wrangler toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Wrangler version
        run: test "$(npx wrangler --version | tail -n 1)" = "4.135.0"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Simulate Workers Builds Web build
        run: make cloudflare-build
