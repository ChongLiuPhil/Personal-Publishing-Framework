schema: ppf/v0.1

project:
  id: replace-with-project-id
  type: book
  title: Replace with Book Title

source:
  canonical: git
  branch: main
  visibility: public

publication:
  web:
    format: html
    mode: continuous
    enabled: true
    authorization_state: not-authorized
    visibility: public
    access:
      mode: none
      implementation: null
      policy_ref: null

  epub:
    format: epub
    mode: on-demand
    enabled: true

  pdf:
    format: pdf
    mode: on-demand
    enabled: true

  docx:
    format: docx
    mode: on-demand
    enabled: true

  latex:
    format: latex
    mode: on-demand
    enabled: true
deployment:
  web:
    provider: cloudflare-workers
    integration_mode: workers-builds-git
    build_contract: cloudflare-builds.yaml
    canonical_publish_gate: "make web-publish-check"
    enabled: false
    status: staged
    output_directory: _book
    production_url: null
    provider_url: null
    canonical_identity:
      type: null
      url: null
    readiness:
      cloudflare_account: unverified
      github_app: unverified
      repository_connection: unverified
      worker_target: unverified
      production_trigger: unverified
      preview_trigger: unverified
      build_token: unverified
      first_preview_build: not-run
      production_cutover: blocked

release:
  require_explicit_release: true
  continuous_web_is_release: false

archive:
  preserve_source: true
  preserve_release_artifacts: true
